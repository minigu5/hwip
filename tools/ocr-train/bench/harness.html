<!doctype html><meta charset="utf-8"><title>ocr bench</title>
<body><pre id="log"></pre>
<script>window.MathJax = { svg: { fontCache: 'none' }, startup: { typeset: false } };</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg-full.js"></script>
<script src="formulas.js"></script>
<script src="converter.js"></script>
<script src="preprocess.js"></script>
<script type="module">
import { env, VisionEncoderDecoderModel, PreTrainedTokenizer, Tensor, cat } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5';
env.allowLocalModels = true; env.allowRemoteModels = false; env.localModelPath = '/models/'; env.useBrowserCache = false;
const params = new URLSearchParams(location.search);
const VARIANTS = (params.get('v') || 'fp32,fp16,w8,dq8pc,dq8').split(',');
const LIMIT = +(params.get('n') || 9999);
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const send = (obj) => fetch('/log', { method: 'POST', body: JSON.stringify(obj) });

await MathJax.startup.promise;
function svgOf(tex) {
  const node = MathJax.tex2svg(tex, { display: true });
  const svg = node.querySelector('svg');
  if (!svg || svg.querySelector('[data-mjx-error], merror')) return null;
  return svg;
}
// SVG → 캔버스 (ex 단위를 px로). fg/bg로 다크모드 흉내
async function raster(tex, exPx, fg, bg, pad) {
  const svg = svgOf(tex); if (!svg) return null;
  const w = parseFloat(svg.getAttribute('width')) * exPx, h = parseFloat(svg.getAttribute('height')) * exPx;
  svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('color', fg); svg.style.color = fg;
  const xml = new XMLSerializer().serializeToString(svg).replace(/currentColor/g, fg);
  const img = new Image();
  img.src = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml' }));
  await img.decode();
  const c = document.createElement('canvas');
  c.width = Math.ceil(w + pad * 2); c.height = Math.ceil(h + pad * 2);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, pad, pad, w, h);
  return c;
}
const toBlob = (c, type, q) => new Promise(r => c.toBlob(r, type, q));

const SCEN = {
  clean: async t => { const c = await raster(t, 14, '#000', '#fff', 24); return c && toBlob(c, 'image/png'); },
  small: async t => { const c = await raster(t, 6.5, '#111', '#fff', 10); return c && toBlob(c, 'image/jpeg', 0.6); },
  dark:  async t => { const c = await raster(t, 9, '#ececec', '#212121', 16); return c && toBlob(c, 'image/png'); },
};

// 인식 결과가 '보기에 같은지' — 같은 크기로 렌더해 픽셀 비교
async function visualSame(a, b) {
  try {
    const ca = await raster(a, 10, '#000', '#fff', 2), cb = await raster(b, 10, '#000', '#fff', 2);
    if (!ca || !cb) return false;
    if (Math.abs(ca.width - cb.width) > 2 || Math.abs(ca.height - cb.height) > 2) return false;
    const W = Math.min(ca.width, cb.width), H = Math.min(ca.height, cb.height);
    const da = ca.getContext('2d').getImageData(0, 0, W, H).data, db = cb.getContext('2d').getImageData(0, 0, W, H).data;
    let ink = 0, diff = 0;
    for (let i = 0; i < da.length; i += 4) { const pa = da[i] < 128, pb = db[i] < 128; if (pa || pb) ink++; if (pa !== pb) diff++; }
    return ink > 0 && diff / ink < 0.05;
  } catch (e) { return false; }
}
const hwpKey = t => { try { return LatexToHwp.convert('$$' + t + '$$').replace(/[\s`~]/g, ''); } catch (e) { return '?' + t; } };
const toks = t => (t.replace(/\\[,;:! ]|\\quad|\\qquad|\\displaystyle/g, '').match(/\\[a-zA-Z]+|\\.|\S/g) || []);
function ned(a, b) { // 토큰 편집거리 / 정답 길이
  const A = toks(a), B = toks(b), d = Array.from({ length: A.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= B.length; j++) d[0][j] = j;
  for (let i = 1; i <= A.length; i++) for (let j = 1; j <= B.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (A[i-1] === B[j-1] ? 0 : 1));
  return d[A.length][B.length] / Math.max(1, B.length);
}

// 이미지 생성 + 전처리 (모든 변형이 같은 입력을 씀)
const items = [];
if (params.get('src') === 'mpl') {
  for (const o of await (await fetch('mpl/list.json')).json())
    items.push({ id: o.fi + ':' + o.scen, fi: o.fi, scen: o.scen, gt: o.gt, arr: await preprocessImage(await (await fetch(o.file)).blob()) });
} else for (const [fi, tex] of FORMULAS.slice(0, LIMIT).entries()) {
  for (const s of Object.keys(SCEN)) {
    const blob = await SCEN[s](tex);
    if (!blob) { log('render fail: ' + tex); continue; }
    items.push({ id: fi + ':' + s, fi, scen: s, gt: tex, arr: await preprocessImage(blob) });
  }
}
log('items ' + items.length);
send({ type: 'start', items: items.length, variants: VARIANTS });

for (const v of VARIANTS) {
  const t0 = performance.now();
  let model, tok;
  try {
    model = await VisionEncoderDecoderModel.from_pretrained(v, { dtype: 'fp32' });
    tok = await PreTrainedTokenizer.from_pretrained(v);
  } catch (e) { log(v + ' load fail ' + e); send({ type: 'loadfail', v, err: String(e) }); continue; }
  const loadMs = performance.now() - t0;
  log(v + ' loaded ' + Math.round(loadMs) + 'ms');
  for (const it of items) {
    const s1 = new Tensor('float32', it.arr, [1, 1, 384, 384]);
    const t1 = performance.now();
    const out = await model.generate({ inputs: cat([s1, s1, s1], 1) });
    const ms = performance.now() - t1;
    const pred = tok.batch_decode(out, { skip_special_tokens: true })[0].trim();
    const rec = { type: 'pred', v, id: it.id, scen: it.scen, gt: it.gt, pred, ms: Math.round(ms),
      vis: await visualSame(pred, it.gt), hwp: hwpKey(pred) === hwpKey(it.gt), ned: +ned(pred, it.gt).toFixed(4) };
    send(rec);
  }
  log(v + ' done');
  send({ type: 'done', v, loadMs: Math.round(loadMs) });
  await model.dispose?.();
}
send({ type: 'finished' }); log('FINISHED');
</script>
